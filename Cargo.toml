[workspace]
resolver = "3"
members = [
    "crates/fast-engine",
    "crates/migrate-engine",
    "crates/cli",
]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT"
repository = "https://github.com/terrarich2004/fast-n-rust-everything"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
